[package]
name = "aws-gui"
version = "0.1.0"
description = "A lightweight local AWS workspace"
edition = "2021"
license = "MIT"
repository = "https://github.com/leessang10/aws-gui"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros"] }
rfd = "0.17.2"
tauri-plugin-opener = "2"
